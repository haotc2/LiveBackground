<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#03040b" />
    <title>Đêm đầy sao của chúng mình</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Great+Vibes&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="stars" aria-hidden="true"></canvas>
    <main class="hero">
      <section class="wedding-card" aria-label="Tên cô dâu và chú rể">
        <p class="monogram" id="monogram">M<span>&amp;</span>H</p>
        <h1>
          <span id="bride-name">Minh Anh</span>
          <span class="ampersand">&amp;</span>
          <span id="groom-name">Hoàng Nam</span>
        </h1>
        <time id="wedding-date" datetime="2026-12-20">20 · 12 · 2026</time>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
